name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - src/**
      - worker/**
      - public/**
      - index.html
      - vite.config.ts
      - wrangler.jsonc
      - tsconfig*.json
      - package.json
      - package-lock.json
      - rally.config.json
      - rally.config.schema.json
      - scripts/**
      - .github/workflows/deploy-pages.yml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for matching Worker configuration
        env:
          RALLY_CONFIG_VERIFY_ATTEMPTS: 24
          RALLY_CONFIG_VERIFY_INTERVAL_MS: 10000
        run: npm run config:verify-deployed

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5