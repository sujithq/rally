name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - rally.config.json
      - rally.config.schema.json
      - scripts/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          node <<'NODE'
          const requiredSecrets = {
            CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
            CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_KV_NAMESPACE_ID: process.env.CLOUDFLARE_KV_NAMESPACE_ID,
          }
          const missingSecrets = Object.entries(requiredSecrets)
            .filter(([, value]) => !value?.trim())
            .map(([name]) => name)
          if (missingSecrets.length) {
            throw new Error(`Add these GitHub Actions repository secrets: ${missingSecrets.join(', ')}`)
          }
          if (!/^[a-f0-9]{32}$/i.test(requiredSecrets.CLOUDFLARE_ACCOUNT_ID.trim())) {
            throw new Error('CLOUDFLARE_ACCOUNT_ID must be a 32-character Cloudflare account ID.')
          }
          if (!/^[a-f0-9]{32}$/i.test(requiredSecrets.CLOUDFLARE_KV_NAMESPACE_ID.trim())) {
            throw new Error('CLOUDFLARE_KV_NAMESPACE_ID must be a 32-character Workers KV namespace ID.')
          }
          NODE

      - name: Validate Worker deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npm run worker:identity

      - name: Verify Cloudflare Worker setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('rally.config.json', 'utf8'))
          const url = new URL(
            `/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/services/${config.deployment.workerName}`,
            'https://api.cloudflare.com',
          )
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          })
          const payload = await response.json()
          const errors = Array.isArray(payload.errors) ? payload.errors : []
          if (errors.some((error) => error.code === 10000)) {
            throw new Error(
              'CLOUDFLARE_API_TOKEN cannot access Workers for this account. '
              + 'Create it from the Edit Cloudflare Workers template and scope it to CLOUDFLARE_ACCOUNT_ID.',
            )
          }
          if (!response.ok && response.status !== 404) {
            const details = errors.map((error) => `${error.code}: ${error.message}`).join('; ')
            throw new Error(`Cloudflare Worker access check failed${details ? `: ${details}` : '.'}`)
          }

          const subdomainResponse = await fetch(new URL(
            `/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,
            'https://api.cloudflare.com',
          ), {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          })
          const subdomainPayload = await subdomainResponse.json()
          const subdomainErrors = Array.isArray(subdomainPayload.errors)
            ? subdomainPayload.errors
            : []
          if (subdomainErrors.some((error) => error.code === 10007)) {
            throw new Error(
              'Register an account workers.dev subdomain in Cloudflare Workers & Pages before deploying: '
              + 'https://dash.cloudflare.com/?to=/:account/workers-and-pages',
            )
          }
          if (!subdomainResponse.ok) {
            const details = subdomainErrors
              .map((error) => `${error.code}: ${error.message}`)
              .join('; ')
            throw new Error(`Cloudflare subdomain check failed${details ? `: ${details}` : '.'}`)
          }
          NODE

      - name: Prepare production Worker configuration
        env:
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npm run worker:config

      - name: Validate Worker bundle
        run: npm run check:worker

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.59.1
          command: deploy --config wrangler.ci.json

      - name: Publish deployment URL
        run: echo "Worker URL - ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"